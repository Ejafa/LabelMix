# # ==========================================
# # Training Loop (Step-Based)
# # ==========================================
# num_steps: 190000       
# num_logs: 1000             
# num_evals: 100                     
# num_saves: 10              
# batch_size: 128         
# warmup_steps: 1000      
# patience_steps: 1000  
# warmup_prefix: true

# ==========================================
# Scheduler (Step-Based)
# ==========================================
sched: cosine
lr: 3.0e-4                    
warmup_lr: 0.0

# ==========================================
# Optimization
# ==========================================
opt: nadamw
weight_decay: 0.1
clip_grad: 5.0


# ==========================================
# Model Parameters
# ==========================================
pretrained: false
num_classes: 100
img_size: 256
model_ema: true
model_ema_decay: 0.9995

# ==========================================
# Dataset Parameters
# ==========================================
dataset: hfds/uoft-cs/cifar100
data_dir: ./data/cifar100
train_split: train
val_split: test
input_key: img
target_key: fine_label
dataset_download: true
balanced_mode: min
mean: [0, 0, 0]
std: [1, 1, 1]


# # ==========================================
# # Augmentation & Regularization (NEUTRALIZED)
# # ==========================================
# # Auto-Augmentation Policy
# aa: null                        # Set to null/None to disable RandAugment
# aug_repeats: 0.0                # No repetition
# aug_splits: 0                   

# # Geometric Transformations (Forced Deterministic)
# train_interpolation: bicubic    # Use a fixed interpolation (bicubic is better for upscaling)
# scale: [1.0, 1.0]               # Force crop to cover 100% of the image
# ratio: [1.0, 1.0]               # Force aspect ratio to be original (square)
# hflip: 0.0                      # Disable horizontal flip
# vflip: 0.0                      # Disable vertical flip

# # Photometric (Color & Blur)
# color_jitter: 0.0               # Disable color changes
# grayscale_prob: 0.0             # Disable grayscale conversion
# gaussian_blur_prob: 0.0         # Disable blur

# # Regional Deletion (Random Erasing)
# reprob: 0.0                     # Disable random erasing

# # Mixed-Sample Augmentation
# mixup: 0.0                      
# cutmix: 0.0                     

# # Label Regularization
# smoothing: 0.1                  # Set to 0.0 to use hard labels (optional)


# ==========================================
# Augmentation & Regularization
# ==========================================
# Auto-Augmentation Policy
aa: rand-m8-inc1-mstd1.0        # RandAugment magnitude 8, std 1.0
aug_repeats: 0               # Repeated augmentation factor
aug_splits: 0                   # Number of augmentation splits (0 = disabled)

# Geometric Transformations
train_interpolation: random     # Interpolation (random, bilinear, bicubic)
scale: [0.08, 1.0]              # Random resize scale range
ratio: [0.75, 1.3333333333333333] # Random resize aspect ratio range
hflip: 0.5                      # Horizontal flip probability
vflip: 0.0                      # Vertical flip probability (disabled)

# Photometric (Color & Blur)
color_jitter: 0.4               # Brightness/Contrast/Saturation factor
grayscale_prob: 0.1             # Probability of grayscale conversion
gaussian_blur_prob: 0.05        # Probability of Gaussian blur

# Regional Deletion (Random Erasing)
reprob: 0.25                    # Random erase probability
remode: pixel                   # Erase mode (fill with random pixels)
recount: 1                      # Number of areas to erase

# Mixed-Sample Augmentation (Disabled)
mixup: 0.0                      # Mixup alpha (0.0 = disabled)
cutmix: 0.0                     # Cutmix alpha (0.0 = disabled)
mixup_prob: 1.0                 # Probability of applying Mixup/Cutmix
mixup_switch_prob: 0.5          # Probability of switching between them

# Label Regularization
smoothing: 0.1                  # Label smoothing factor    # Optional: Turn off mixup after N steps

# ==========================================
# Device & Distributed
# ==========================================
device: cuda
amp: true
amp_dtype: bfloat16
workers: 8
# pin_mem: false
# no_prefetcher: true
no_aug: true

# ==========================================
# Logging
# ==========================================
output: ./output_cifar100_baseline_mnv4
experiment: mnv4_baseline_cifar100
log_wandb: true
wandb_project: labelmix

# ==========================================
# Balanced Dataset + LabelMix (test overrides)
# ==========================================
balanced_mode: max
balanced_buffer: 256
balanced_cache_threshold: 256

labelmix: true
labelmix_mix_k: 5
labelmix_alpha_min: 0.1
labelmix_alpha_max: 2
labelmix_schedule: linear
labelmix_reverse: false
labelmix_step_mode: total
labelmix_sampling: true
labelmix_sampling_min_side_px: 8
labelmix_sampling_max_aspect: 20
labelmix_sampling_bins: 16
labelmix_sampling_pool_size: 256
labelmix_sampling_low_watermark: 64
labelmix_sampling_max_attempts: 200
# labelmix_total_steps: 2000  # optional; defaults to num_steps if omitted

# Short run overrides
num_steps: 200
warmup_steps: 10
patience_steps: 20
batch_size: 64
log_interval: 10
num_logs: 10
num_evals: 1
num_saves: 1
log_wandb: false