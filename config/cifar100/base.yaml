# # ==========================================
# # Training Loop (Step-Based)
# # ==========================================
# num_steps: 190000       
# num_logs: 1000             
# num_evals: 100                     
# num_saves: 10              
# batch_size: 128         
# warmup_steps: 1000      
# patience_steps: 1000  
# warmup_prefix: true

# ==========================================
# Scheduler (Step-Based)
# ==========================================
sched: cosine
lr: 0.001 #3.0e-4                    
warmup_lr: 0.0

# ==========================================
# Optimization
# ==========================================
opt: adamw
weight_decay: 0.1
clip_grad: 5.0


# ==========================================
# Model Parameters
# ==========================================
pretrained: false
num_classes: 100
img_size: 256
model_ema: true
model_ema_decay: 0.999


# ==========================================
# Dataset Parameters
# ==========================================
dataset: hfds/uoft-cs/cifar100
data_dir: ./data/cifar100
train_split: train
val_split: test
input_key: img
target_key: fine_label
dataset_download: true
balanced_mode: min  # temporarily disabled
mean: [0, 0, 0]
std: [1, 1, 1]


# # ==========================================
# # Augmentation & Regularization (NEUTRALIZED)
# # ==========================================
# # Auto-Augmentation Policy
aa: rand-m8-inc1-mstd1.0        # RandAugment magnitude 8, std 1.0
# aug_repeats: 0.0                # No repetition
# aug_splits: 0                   

# # Geometric Transformations (Forced Deterministic)
# train_interpolation: bicubic    # Use a fixed interpolation (bicubic is better for upscaling)
# scale: [1.0, 1.0]               # Force crop to cover 100% of the image
# ratio: [1.0, 1.0]               # Force aspect ratio to be original (square)
# hflip: 0.0                      # Disable horizontal flip
# vflip: 0.0                      # Disable vertical flip

# # Photometric (Color & Blur)
# color_jitter: 0.0               # Disable color changes
# grayscale_prob: 0.0             # Disable grayscale conversion
# gaussian_blur_prob: 0.0         # Disable blur

# # Regional Deletion (Random Erasing)
# reprob: 0.0                     # Disable random erasing

# # Mixed-Sample Augmentation
# mixup: 0.0                      
# cutmix: 0.0                     

# # Label Regularization
# smoothing: 0.1                  # Set to 0.0 to use hard labels (optional)



# ==========================================
# Device & Distributed
# ==========================================
device: cuda
amp: true
amp_dtype: bfloat16
workers: 8
# pin_mem: false
# no_prefetcher: true
# no_aug: true

# ==========================================
# Logging
# ==========================================
output: ./output_cifar100_baseline_mnv4
experiment: mnv4_baseline_cifar100
log_wandb: true
wandb_project: labelmix
