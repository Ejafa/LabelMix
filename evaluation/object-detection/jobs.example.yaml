shared:
  data_root: ./data
  device: cuda
  run: train+test
  work_dir: output_test/mmdet_eval

jobs:
  - name: cnn
    timm_model: mobilenetv4_conv_small
    configs:
      - /path/to/mmdet/configs/faster_rcnn/faster-rcnn_r50_fpn_1x_coco.py
      - /path/to/mmdet/configs/faster_rcnn/faster-rcnn_r50_fpn_1x_voc0712.py
    backbone_checkpoints:
      - /path/to/ckpt1.pth
      - /path/to/ckpt2.pth

  - name: vit
    timm_model: vit_base_patch16_224
    configs:
      - /path/to/mmdet/configs/faster_rcnn/faster-rcnn_r50_fpn_1x_coco.py
      - /path/to/mmdet/configs/faster_rcnn/faster-rcnn_r50_fpn_1x_voc0712.py
    backbone_checkpoints:
      - /path/to/vit_ckpt1.pth
